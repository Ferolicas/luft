packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  multer: '>=2.5.0'
  mysql2: '>=3.24.0'
  deepmerge-ts: '>=8.0.0'
  fast-uri: '>=4.2.3'
  handlebars: '>=4.7.10'
  engine.io: '>=6.6.11'
  js-yaml: '>=5.4.1'
  brace-expansion@1: '>=1.1.21 <2'
  brace-expansion@5: '>=5.0.12'
  body-parser: '>=2.4.0'
  proxy-addr: '>=2.0.8'
  qs: '>=6.16.1'
  sharp: '>=0.35.5'
  source-map-js: '>=1.2.2'
  zod: '>=4.6.7'

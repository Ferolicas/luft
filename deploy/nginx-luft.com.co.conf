# luft.com.co DESPUÉS de la activación (lo instala `luft-activar-dominio`).
map $http_x_forwarded_proto $luft_proto {
    default $scheme;
    https   https;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name luft.com.co;
    ssl_certificate /etc/letsencrypt/live/luft.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luft.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/proxy-luft.inc;
}

# www → dominio principal (usa el mismo certificado si incluye www).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.luft.com.co;
    ssl_certificate /etc/letsencrypt/live/luft.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luft.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://luft.com.co$request_uri;
}

# HTTP: reto del certificado y, detrás de Cloudflare, la app; lo demás va a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name luft.com.co www.luft.com.co;
    location ^~ /.well-known/acme-challenge/ { root /var/www/luft-acme; default_type text/plain; }
    location ^~ /.well-known/luft/ { root /var/www/luft-acme; default_type text/plain; }
    location / {
        if ($http_x_forwarded_proto != "https") { return 301 https://luft.com.co$request_uri; }
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        if ($http_x_forwarded_proto != "https") { return 301 https://luft.com.co$request_uri; }
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location /socket.io/ {
        if ($http_x_forwarded_proto != "https") { return 301 https://luft.com.co$request_uri; }
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}

# luft.com.co ANTES de la activación: el dominio aún no tiene certificado propio.
# Responde la comprobación de dominio y el reto del certificado, y sirve la app
# para que funcione detrás de Cloudflare (modo Flexible por el 80 o Full por el
# 443 con el certificado provisional). `luft-activar-dominio` lo reemplaza.
map $http_x_forwarded_proto $luft_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name luft.com.co www.luft.com.co;
    include /etc/nginx/snippets/proxy-luft.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name luft.com.co www.luft.com.co;
    ssl_certificate /etc/letsencrypt/live/luft.restaurar.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luft.restaurar.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/proxy-luft.inc;
}
